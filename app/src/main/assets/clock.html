<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self' file:; connect-src 'none'">
<title>桌面时钟</title>
<style>
@font-face {font-family:WOX;src:url('fonts/WOX-Striped-Triple-Demo-1.otf') format('opentype');font-weight:normal;font-style:normal;}
* {box-sizing:border-box;-webkit-box-sizing:border-box;}
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ddd;font-family:sans-serif;-webkit-user-select:none;user-select:none;}
#stage {position:absolute;left:0;top:0;right:0;bottom:0;}
#moving {position:absolute;white-space:nowrap;text-align:center;}
#digits {white-space:nowrap;line-height:1.1;font-family:WOX,sans-serif;font-weight:normal;}
.digit {display:inline-block;text-align:center;}
#seconds {display:inline-block;margin-left:6px;color:#999;}
#date {position:absolute;top:100%;left:0;width:100%;margin-top:12px;letter-spacing:2px;color:#aaa;}
#ftp {position:absolute;right:31px;bottom:27px;margin:0;padding:8px;border:0;border-radius:0;background:#000;color:#bbb;font-size:14px;min-height:44px;min-width:88px;}
#ftp[aria-checked="true"] {color:#ddd;}
#ftp:disabled {opacity:.5;}
#track {display:inline-block;vertical-align:middle;width:28px;height:16px;border:1px solid currentColor;border-radius:10px;margin-right:8px;text-align:left;}
#thumb {display:inline-block;width:10px;height:10px;margin:2px;border-radius:50%;background:currentColor;}
#ftp[aria-checked="true"] #thumb {margin-left:14px;}
#logs {position:absolute;bottom:12px;left:16px;right:142px;height:64px;overflow:hidden;font:11px/16px monospace;color:#777;white-space:pre-wrap;word-wrap:break-word;}
#probe {position:absolute;visibility:hidden;white-space:nowrap;font-family:WOX,sans-serif;}
</style></head><body>
<div id="stage"><div id="moving">
<div id="digits"><span id="hours"></span><span>:</span><span id="minutes"></span><span id="seconds">:<span id="secondDigits"></span></span></div>
<div id="date"></div>
</div></div>
<button id="ftp" type="button" role="switch" aria-label="FTP" aria-checked="false" disabled><span id="track"><span id="thumb"></span></span><span id="ftpLabel">OFF</span></button>
<div id="logs" role="log" aria-label="最近的警告与调试日志"></div><span id="probe"></span>
<script>
// ES5 only: no flex/grid/variables/Promise or required FontFaceSet APIs.
(function () {
'use strict';
var ids={}, lastTime='', lastDate='', x=0, y=0, step=0, timer=null, suspended=false;
var lastStatus='', digitSize=0;
function elapsed(){return window.performance && window.performance.now ? window.performance.now() : Date.now();}
var lastTick=elapsed(), nextMove=lastTick+600000;
function el(id){return ids[id]||(ids[id]=document.getElementById(id));}
function pad(n){return (n<10?'0':'')+n;}
function pair(id,s){var p=el(id);if(!p.firstChild){for(var i=0;i<2;i++){var v=document.createElement('span');v.className='digit';p.appendChild(v);}}p.children[0].textContent=s.charAt(0);p.children[1].textContent=s.charAt(1);}
function draw(){var d=new Date(),s=pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());if(s!==lastTime){pair('hours',s.substr(0,2));pair('minutes',s.substr(2,2));pair('secondDigits',s.substr(4,2));lastTime=s;}var date=(d.getMonth()+1)+'月'+d.getDate()+'日  星期'+'日一二三四五六'.charAt(d.getDay());if(date!==lastDate){el('date').textContent=date;lastDate=date;}}
function sizes(size){digitSize=size;el('digits').style.fontSize=size+'px';el('seconds').style.fontSize=Math.round(size*.32)+'px';el('date').style.fontSize=Math.max(14,Math.round(size*.12))+'px';var probe=el('probe'),max=0;probe.style.fontSize=size+'px';for(var i=0;i<10;i++){probe.textContent=String(i);max=Math.max(max,probe.getBoundingClientRect().width);}var nodes=document.querySelectorAll('.digit');for(i=0;i<nodes.length;i++){nodes[i].style.width=(max*(i<4?1:.32))+'px';}}
function position(){var stage=el('stage'),m=el('moving');m.style.left=Math.round((stage.clientWidth-m.offsetWidth)/2+x)+'px';m.style.top=Math.round((stage.clientHeight-m.offsetHeight)/2+y)+'px';el('ftp').style.right=(31-x)+'px';el('ftp').style.bottom=(27-y)+'px';}
function layout(){draw();var stage=el('stage'),m=el('moving');sizes(Math.max(24,Math.min(stage.clientWidth*.18,Math.max(24,stage.clientHeight-160)*.53)));for(var i=0;i<5;i++){var ratio=Math.min((stage.clientWidth-40)/m.offsetWidth,Math.max(16,stage.clientHeight-180)/m.offsetHeight,1);if(ratio>=.99)break;sizes(Math.max(16,Math.floor(digitSize*ratio)));}position();}
// Each step changes exactly one axis by 3 CSS px; a closed path stays within +/-15.
function move(){if(step<5)x+=3;else if(step<10)y+=3;else if(step<20)x-=3;else if(step<30)y-=3;else if(step<40)x+=3;else if(step<45)y+=3;else x-=3;step=(step+1)%50;position();}
function tick(){if(suspended)return;draw();var now=elapsed();if(now<lastTick)nextMove=now+600000;lastTick=now;if(now>=nextMove){move();nextMove=now+600000;}timer=setTimeout(tick,1000-Date.now()%1000);}
window.clockLifecycle=function(active){suspended=!active;if(timer!==null)clearTimeout(timer);if(active){layout();tick();}};
window.clockUpdate=function(data){var status=data.running?'ON':'OFF';el('ftp').setAttribute('aria-busy',data.busy?'true':'false');if(status!==lastStatus){el('ftpLabel').textContent=status;lastStatus=status;}el('ftp').disabled=!!data.busy;el('ftp').setAttribute('aria-checked',data.running?'true':'false');if(el('logs').textContent!==data.logs)el('logs').textContent=data.logs||'';if(data.error)el('logs').textContent=data.error+'\n'+(data.logs||'');};
el('ftp').onclick=function(){if(this.disabled)return;this.disabled=true;try{Android.setFtp(this.getAttribute('aria-checked')!=='true');}catch(e){this.disabled=false;el('logs').textContent='FTP 控制不可用';}};
window.addEventListener('resize',layout,false);layout();tick();setTimeout(layout,300);setTimeout(layout,1500);setTimeout(layout,4000);
// Optional on new engines; old engines use bounded metric retries above.
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
}());
</script></body></html>
